# .github/workflows/stickman-video.yml
name: Stickman Video Render

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Autopilot style"
        required: true
        type: choice
        default: "B1"
        options:
          - B1
          - B2
      preview_seconds:
        description: "Preview length in seconds"
        required: true
        default: "20"
        type: string

jobs:
  autopilot-render:
    name: Autopilot runtime check + preview + render
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: skills/directing-stickman-videos

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg + FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Run doctor check
        run: node scripts/autopilot.mjs doctor

      - name: Create project outside the skill folder
        run: |
          mkdir -p /tmp/stickman-project
          node scripts/autopilot.mjs init /tmp/stickman-project --style "${{ inputs.style }}"

      - name: Write project manifest
        run: |
          cat > /tmp/stickman-project/project.json <<'JSON'
          {
            "version": 1,
            "style": "${{ inputs.style }}",
            "width": 1280,
            "height": 720,
            "fps": 30,
            "voice": {
              "path": "narration.wav",
              "lead": 0.15,
              "tail": 0.35
            },
            "captions": [
              {"start": 0.30, "end": 2.20, "text": "This is your first spoken phrase."},
              {"start": 2.20, "end": 4.60, "text": "This is your second spoken phrase."},
              {"start": 4.60, "end": 7.00, "text": "This is your third spoken phrase."}
            ],
            "shots": [
              {
                "start": 0,
                "end": 7,
                "layers": [
                  {"type": "text", "text": "YOUR IDEA", "x": 90, "y": 140, "size": 58, "bold": true},
                  {"type": "pose", "pose": 1, "x": 710, "y": 30, "w": 430},
                  {"type": "image", "path": "@b1/idea-bulb-crayon.png", "x": 170, "y": 260, "w": 160}
                ]
              }
            ],
            "sfx": [
              {"time": 0.30, "kind": "pop", "gain": 0.025},
              {"time": 3.20, "kind": "tap", "gain": 0.020}
            ]
          }
          JSON

      - name: Copy sample narration audio
        run: |
          # Replace this with your real narration.wav after you generate it
          # Example:
          # cp /path/to/your/narration.wav /tmp/stickman-project/narration.wav
          echo "Sample workflow only. Add your real narration.wav before a real render."

      - name: Validate project
        run: |
          node scripts/autopilot.mjs validate /tmp/stickman-project/project.json --seconds "${{ inputs.preview_seconds }}"

      - name: Generate preview
        run: |
          node scripts/autopilot.mjs preview /tmp/stickman-project/project.json --seconds "${{ inputs.preview_seconds }}"

      - name: Approve preview
        run: |
          node scripts/autopilot.mjs approve \
            /tmp/stickman-project/project.json \
            --note "Approved in GitHub Actions for full render"

      - name: Render full film
        run: |
          node scripts/autopilot.mjs render /tmp/stickman-project/project.json

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stickman-video-output
          path: |
            /tmp/stickman-project/**
          if-no-files-found: error
