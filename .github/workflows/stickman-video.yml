name: Stickman Video Render

on:
  workflow_dispatch:
    inputs:
      style:
        description: "B style"
        required: true
        default: "B1"
        type: choice
        options:
          - B1
          - B2
      duration_seconds:
        description: "Preview length in seconds for validation"
        required: true
        default: "20"
        type: string

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FFmpeg: /usr/bin/ffmpeg
      FFPROBE: /usr/bin/ffprobe

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: npm ci

      - name: Run skill doctor
        run: node scripts/autopilot.mjs doctor

      - name: Create project outside skill folder
        run: |
          mkdir -p $RUNNER_TEMP/stickman-project
          node scripts/autopilot.mjs init $RUNNER_TEMP/stickman-project --style "${{ inputs.style }}"

      - name: Prepare project.json
        run: |
          cat > $RUNNER_TEMP/stickman-project/project.json <<'JSON'
          {
            "version": 1,
            "style": "${{ inputs.style }}",
            "width": 1280,
            "height": 720,
            "fps": 30,
            "voice": {
              "path": "narration.wav",
              "lead": 0.15,
              "tail": 0.35
            },
            "captions": [
              {"start": 0.3, "end": 2.2, "text": "Your spoken phrase goes here."},
              {"start": 2.2, "end": 4.5, "text": "This is your second caption."}
            ],
            "shots": [
              {
                "start": 0,
                "end": 4,
                "layers": [
                  {"type": "text", "text": "YOUR IDEA", "x": 90, "y": 140, "size": 58, "bold": true},
                  {"type": "pose", "pose": 1, "x": 700, "y": 40, "w": 430},
                  {"type": "image", "path": "@b1/idea-bulb-crayon.png", "x": 170, "y": 260, "w": 170}
                ]
              }
            ],
            "sfx": [
              {"time": 0.3, "kind": "pop", "gain": 0.025}
            ]
          }
          JSON

      - name: Copy narration audio
        run: |
          mkdir -p $RUNNER_TEMP/stickman-project
          # replace this with your real narration.wav file
          # cp /path/to/your/narration.wav $RUNNER_TEMP/stickman-project/narration.wav

      - name: Validate preview
        run: node scripts/autopilot.mjs validate $RUNNER_TEMP/stickman-project/project.json --seconds "${{ inputs.duration_seconds }}"

      - name: Preview sample
        run: node scripts/autopilot.mjs preview $RUNNER_TEMP/stickman-project/project.json --seconds "${{ inputs.duration_seconds }}"

      - name: Approve preview
        run: |
          node scripts/autopilot.mjs approve \
            $RUNNER_TEMP/stickman-project/project.json \
            --note "Approved in GitHub Actions"

      - name: Render full film
        run: node scripts/autopilot.mjs render $RUNNER_TEMP/stickman-project/project.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stickman-video-output
          path: |
            $RUNNER_TEMP/stickman-project/**
