name: Stickman Video Render

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Autopilot style"
        required: true
        type: choice
        default: "B1"
        options:
          - B1
          - B2
      preview_seconds:
        description: "Preview length in seconds"
        required: true
        type: string
        default: "20"

jobs:
  autopilot-render:
    name: Autopilot runtime + preview + render
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: skills/directing-stickman-videos

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Run doctor
        run: node scripts/autopilot.mjs doctor

      - name: Create project outside skill folder
        id: project
        shell: bash
        run: |
          PROJECT_DIR=/tmp/stickman-project-${{ github.run_id }}
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          rm -rf "$PROJECT_DIR"
          node scripts/autopilot.mjs init "$PROJECT_DIR" --style "${{ inputs.style }}"

      - name: Write project manifest
        shell: bash
        run: |
          cat > "$PROJECT_DIR/project.json" <<'JSON'
          {
            "version": 1,
            "style": "${{ inputs.style }}",
            "width": 1280,
            "height": 720,
            "fps": 30,
            "voice": {
              "path": "narration.wav",
              "lead": 0.15,
              "tail": 0.35
            },
            "captions": [
              {"start": 0.30, "end": 2.20, "text": "This is your first spoken phrase."},
              {"start": 2.20, "end": 4.60, "text": "This is your second spoken phrase."},
              {"start": 4.60, "end": 7.00, "text": "This is your third spoken phrase."}
            ],
            "shots": [
              {
                "start": 0,
                "end": 7,
                "layers": [
                  {"type": "text", "text": "YOUR IDEA", "x": 90, "y": 140, "size": 58, "bold": true},
                  {"type": "pose", "pose": 1, "x": 710, "y": 30, "w": 430},
                  {"type": "image", "path": "@b1/idea-bulb-crayon.png", "x": 170, "y": 260, "w": 160}
                ]
              }
            ],
            "sfx": [
              {"time": 0.30, "kind": "pop", "gain": 0.025},
              {"time": 3.20, "kind": "tap", "gain": 0.020}
            ]
          }
          JSON
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Copy your narration audio
        shell: bash
        run: |
          # Replace this with your real file if you have one.
          # Example:
          # cp /path/to/your/narration.wav "$PROJECT_DIR/narration.wav"
          echo "Add a real narration.wav before full production render."
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Validate project
        shell: bash
        run: |
          node scripts/autopilot.mjs validate "$PROJECT_DIR/project.json" --seconds "${{ inputs.preview_seconds }}"
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Generate preview
        shell: bash
        run: |
          node scripts/autopilot.mjs preview "$PROJECT_DIR/project.json" --seconds "${{ inputs.preview_seconds }}"
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Approve preview
        shell: bash
        run: |
          node scripts/autopilot.mjs approve "$PROJECT_DIR/project.json" --note "Approved in GitHub Actions"
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Render full film
        shell: bash
        run: |
          node scripts/autopilot.mjs render "$PROJECT_DIR/project.json"
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stickman-video-output
          path: |
            /tmp/stickman-project-${{ github.run_id }}/**
          if-no-files-found: error
