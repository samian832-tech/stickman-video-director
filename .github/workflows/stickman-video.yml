name: Stickman Video Render

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Autopilot style"
        required: true
        type: choice
        default: "B1"
        options:
          - B1
          - B2
      preview_seconds:
        description: "Preview length in seconds"
        required: true
        type: string
        default: "20"

jobs:
  autopilot-render:
    name: Autopilot runtime + preview + render
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: skills/directing-stickman-videos

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Run doctor
        run: node scripts/autopilot.mjs doctor

      - name: Create project outside skill folder
        shell: bash
        run: |
          PROJECT_DIR=/tmp/stickman-project-${{ github.run_id }}
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          rm -rf "$PROJECT_DIR"
          node scripts/autopilot.mjs init "$PROJECT_DIR" --style "${{ inputs.style }}"

      - name: Write project manifest
        shell: bash
        run: |
          cat > "$PROJECT_DIR/project.json" <<'JSON'
          {
            "version": 1,
            "style": "${{ inputs.style }}",
            "width": 1280,
            "height": 720,
            "fps": 30,
            "voice": {
              "path": "narration.wav",
              "lead": 0.15,
              "tail": 0.35
            },
            "captions": [
              {"start": 0.30, "end": 3.80, "text": "This is your first thought."},
              {"start": 4.00, "end": 7.80, "text": "This is your second point."},
              {"start": 8.00, "end": 11.80, "text": "Now the idea starts to click."},
              {"start": 12.00, "end": 15.80, "text": "The important takeaway arrives here."},
              {"start": 16.00, "end": 19.60, "text": "And this is the final message."}
            ],
            "shots": [
              {
                "start": 0,
                "end": 4,
                "layers": [
                  {"type": "text", "text": "IDEA 1", "x": 90, "y": 140, "size": 52, "bold": true},
                  {"type": "pose", "pose": 1, "x": 700, "y": 40, "w": 430},
                  {"type": "image", "path": "@b1/idea-bulb-crayon.png", "x": 170, "y": 260, "w": 160}
                ]
              },
              {
                "start": 4,
                "end": 8,
                "layers": [
                  {"type": "text", "text": "POINT 2", "x": 90, "y": 150, "size": 52, "bold": true},
                  {"type": "pose", "pose": 2, "x": 700, "y": 40, "w": 430},
                  {"type": "image", "path": "@b1/idea-bulb-crayon.png", "x": 180, "y": 260, "w": 160}
                ]
              },
              {
                "start": 8,
                "end": 12,
                "layers": [
                  {"type": "text", "text": "INSIGHT", "x": 90, "y": 140, "size": 52, "bold": true},
                  {"type": "pose", "pose": 0, "x": 710, "y": 30, "w": 430},
                  {"type": "image", "path": "@b1/idea-bulb-crayon.png", "x": 190, "y": 250, "w": 170}
                ]
              },
              {
                "start": 12,
                "end": 16,
                "layers": [
                  {"type": "text", "text": "TAKEAWAY", "x": 90, "y": 140, "size": 52, "bold": true},
                  {"type": "pose", "pose": 1, "x": 700, "y": 40, "w": 430},
                  {"type": "image", "path": "@b1/idea-bulb-crayon.png", "x": 180, "y": 260, "w": 160}
                ]
              },
              {
                "start": 16,
                "end": 20,
                "layers": [
                  {"type": "text", "text": "FINAL", "x": 100, "y": 140, "size": 58, "bold": true},
                  {"type": "pose", "pose": 2, "x": 710, "y": 30, "w": 430},
                  {"type": "image", "path": "@b1/idea-bulb-crayon.png", "x": 170, "y": 260, "w": 160}
                ]
              }
            ],
            "sfx": [
              {"time": 0.30, "kind": "pop", "gain": 0.025},
              {"time": 4.20, "kind": "tap", "gain": 0.020},
              {"time": 8.20, "kind": "pop", "gain": 0.025},
              {"time": 12.20, "kind": "tap", "gain": 0.020},
              {"time": 16.20, "kind": "pop", "gain": 0.025}
            ]
          }
          JSON
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Create dummy narration.wav for validation
        shell: bash
        run: |
          ffmpeg -y -f lavfi -i "anullsrc=r=22050:cl=stereo" -t 20 "$PROJECT_DIR/narration.wav"
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Validate project
        shell: bash
        run: |
          node scripts/autopilot.mjs validate "$PROJECT_DIR/project.json" --seconds "${{ inputs.preview_seconds }}"
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Generate preview
        shell: bash
        run: |
          node scripts/autopilot.mjs preview "$PROJECT_DIR/project.json" --seconds "${{ inputs.preview_seconds }}"
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Approve preview
        shell: bash
        run: |
          node scripts/autopilot.mjs approve "$PROJECT_DIR/project.json" --note "Approved in GitHub Actions"
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Render full film
        shell: bash
        run: |
          node scripts/autopilot.mjs render "$PROJECT_DIR/project.json"
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stickman-video-output
          path: |
            /tmp/stickman-project-${{ github.run_id }}/**
          if-no-files-found: error
